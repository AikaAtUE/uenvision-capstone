# nginx site for UEnvision.
# Install:  sudo cp deploy/nginx-uenvision.conf /etc/nginx/sites-available/uenvision
#           sudo ln -s /etc/nginx/sites-available/uenvision /etc/nginx/sites-enabled/uenvision
# If you have a domain, add it after the IP on the server_name line, e.g.
#   server_name 201.18.219.201 uenvision.example.com www.uenvision.example.com;
# then run certbot (see DEPLOY.md); certbot edits this file to add HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name 201.18.219.201;

    # Importing a folder of job JSONs on the Data page can be a large upload.
    client_max_body_size 100M;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /var/www/uenvision/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://unix:/run/uenvision/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Matches gunicorn --timeout so long Gemini calls aren't cut off.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
