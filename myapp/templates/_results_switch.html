{# Developers only: switch the dashboard / recommendations between real results and dummy (test) results. #}
{% if user.is_developer %}
<form class="results-switch" method="post" action="{% url 'developer_results' %}" aria-label="Which results to show">
  {% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" name="results" value="real" class="results-switch-btn{% if not dev_dummy_view %} is-active{% endif %}"{% if not dev_dummy_view %} aria-pressed="true"{% else %} aria-pressed="false"{% endif %}>Real results</button>
  <button type="submit" name="results" value="dummy" class="results-switch-btn{% if dev_dummy_view %} is-active{% endif %}"{% if dev_dummy_view %} aria-pressed="true"{% else %} aria-pressed="false"{% endif %}>Dummy results</button>
</form>
{% endif %}
