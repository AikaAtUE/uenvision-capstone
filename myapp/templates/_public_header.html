{% load static %}
<header class="pub-header">
  <a href="{% url 'home' %}" class="pub-brand">{% include "_logo.html" with logo_class="pub-logo" %}</a>
  <nav class="pub-nav">
    {% if user.is_authenticated %}
      <a class="btn btn-ghost btn-sm" href="{% if user.is_learner %}{% url 'student_dashboard' %}{% else %}{% url 'dashboard' %}{% endif %}">My dashboard</a>
      {# Log out is always here, so someone who just registered and is still on their survey can sign out. #}
      <a class="btn btn-ghost btn-sm pub-logout" id="logout-btn" href="{% url 'logout' %}">{% include "_icon_logout.html" %}<span>Log out</span></a>
    {% else %}
      <a class="btn btn-ghost btn-sm" href="{% url 'login' %}">Log in</a>
    {% endif %}
  </nav>
</header>
