{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<section id="screen-signup" class="auth-screen is-active">
  <div class="auth-photo" aria-hidden="true"></div>
  <div class="auth-card">
    <div class="auth-brand auth-brand--compact">
      {% include "_logo.html" with logo_class="auth-logo auth-logo--sm" %}
    </div>
    <form class="auth-form" id="signup-form" method="post" action="{% url 'signup' %}">
      {% csrf_token %}
      <label class="field"><span>Last name</span><input type="text" id="signup-lastname" autocomplete="family-name" name="last_name" required></label>
      <label class="field"><span>First name</span><input type="text" id="signup-firstname" autocomplete="given-name" name="first_name" required></label>
      <label class="field"><span>Middle name</span><input type="text" id="signup-middlename" autocomplete="additional-name" name="middle_name"></label>
      <label class="field"><span>UE email</span><input type="email" id="signup-email" autocomplete="email" name="email" placeholder="juan.delacruz@ue.edu.ph" required></label>
      <label class="field"><span>Password</span><input type="password" id="signup-password" autocomplete="new-password" name="password" required></label>
      <label class="field"><span>Re-enter password</span><input type="password" id="signup-password2" autocomplete="new-password" name="password2" required></label>
      <p class="form-msg" id="signup-msg">{% if error %}{{ error }}{% endif %}</p>
      <button type="submit" class="btn btn-navy btn-block">Create account</button>
      <p class="auth-foot">Already have an account? <a class="link-inline" href="{% url 'login' %}">Log in</a></p>
    </form>
  </div>
</section>
{% endblock %}
