{% extends "recs_lab/_base.html" %}
{% block lab_title %}Lab · Faculty view{% endblock %}
{% block lab_heading %}Recommendations Lab · Faculty{% endblock %}
{% block lab_body %}
<form class="rl-form" method="get" action="{% url 'recs_lab_faculty' %}">
  <label class="rl-field rl-field--grow"><span>Subject</span>
    <select name="subject" onchange="if(this.form.prof)this.form.prof.value='';this.form.submit()">
      {% for s in subjects %}<option value="{{ s.code }}"{% if s.code == code %} selected{% endif %}>{{ s.code }} · {{ s.name }}</option>{% endfor %}
    </select>
  </label>
  {% if not own_only %}<label class="rl-field"><span>See it as</span>
    <select name="prof" onchange="this.form.submit()">
      <option value="">All professors of this subject</option>
      {% for pid, pname in professors %}<option value="{{ pid }}"{% if pid == prof %} selected{% endif %}>{{ pname }}</option>{% endfor %}
    </select>
  </label>{% endif %}
  <noscript><button class="btn btn-navy btn-sm" type="submit">Show</button></noscript>
</form>
{% include "recs_lab/_faculty_body.html" %}
{% endblock %}
