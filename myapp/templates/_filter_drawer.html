<div class="drawer-backdrop" id="filter-backdrop"></div>
<aside class="drawer" id="filter-drawer" aria-label="Filters">
  <div class="drawer-head">
    <button class="drawer-close" id="filter-close" aria-label="Close filters">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <h3>Filters</h3>
    <button class="link-inline" id="filter-clear-all">Clear all</button>
  </div>

  <div class="drawer-section">
    <h4>Date range</h4>
    <label class="checkbox"><input type="checkbox" checked><span>2026</span></label>
    <label class="checkbox"><input type="checkbox" checked><span>2025</span></label>
  </div>

  <div class="drawer-section">
    <div class="drawer-section-head"><h4>Program</h4><button class="link-inline link-inline--sm">Clear</button></div>
    <label class="checkbox"><input type="checkbox" checked><span>Computer Science</span></label>
    <label class="checkbox"><input type="checkbox" checked><span>Information Technology</span></label>
  </div>

  <div class="drawer-section">
    <div class="drawer-section-head"><h4>Skill category</h4><button class="link-inline link-inline--sm">Clear</button></div>
    <div class="chip-grid">
      <label class="checkbox"><input type="checkbox" checked><span>Python</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>SQL</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>R</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>Excel</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>Tableau</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>Java</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>Azure</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>AWS</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>AWS RDS</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>PowerBI</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>NoSQL</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>MySQL</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>Oracle</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>PySpark</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>Snowflake</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>Hadoop</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>TensorFlow</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>Pandas</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>C++</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>HTML</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>Linux</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>Networking</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>JavaScript</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>C</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>Ruby</span></label>
      <label class="checkbox"><input type="checkbox" checked><span>SAS</span></label>
    </div>
  </div>

  <div class="drawer-foot">
    <button class="btn btn-navy btn-block" id="filter-apply">Apply filters</button>
  </div>
</aside>
