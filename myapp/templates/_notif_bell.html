{# Administrators: bell in the top-right corner with a dropdown of recent notifications. #}
<div class="notif-bell" id="notif-bell" data-read-url="{% url 'notifications_read' %}" data-poll-url="{% url 'notifications_poll' %}">
  <button type="button" class="notif-bell-btn" id="notif-bell-btn" aria-haspopup="true" aria-expanded="false"
          aria-controls="notif-panel" aria-label="Notifications{% if unread_notifications %}, {{ unread_notifications }} unread{% endif %}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5a6.5 6.5 0 0 0-6.5 6.5v4.2L3.8 16.4c-.4.7.1 1.6.9 1.6h14.6c.8 0 1.3-.9.9-1.6l-1.7-3.2V9A6.5 6.5 0 0 0 12 2.5zM9.5 19.5a2.5 2.5 0 0 0 5 0z" fill="currentColor"/></svg>
    {% if unread_notifications %}<span class="notif-bell-count" id="notif-bell-count">{% if unread_notifications > 99 %}99+{% else %}{{ unread_notifications }}{% endif %}</span>{% endif %}
  </button>
  <div class="notif-panel" id="notif-panel" role="dialog" aria-label="Notifications" hidden>
    {% include "_notif_panel_body.html" %}
  </div>
</div>
