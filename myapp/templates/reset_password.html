{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<section id="screen-reset" class="auth-screen is-active">
  <div class="auth-photo" aria-hidden="true"></div>
  <div class="auth-card auth-card--narrow">
    <div class="lock-icon" aria-hidden="true">
      <svg viewBox="0 0 64 64"><path d="M20 28V22a12 12 0 0 1 24 0v6" fill="none" stroke="#1b2540" stroke-width="4.5" stroke-linecap="round"/><rect x="14" y="28" width="36" height="26" rx="6" fill="none" stroke="#1b2540" stroke-width="4.5"/><circle cx="26" cy="41" r="2.6" fill="#1b2540"/><circle cx="32" cy="41" r="2.6" fill="#1b2540"/><circle cx="38" cy="41" r="2.6" fill="#1b2540"/></svg>
    </div>
    <h1 class="auth-title">Trouble logging in?</h1>
    <form class="auth-form" id="reset-form">
      <label class="field"><span>Enter new password</span><input type="password" id="reset-password" required></label>
      <label class="field"><span>Re-enter new password</span><input type="password" id="reset-password2" required></label>
      <p class="form-msg" id="reset-msg"></p>
      <button type="submit" class="btn btn-navy btn-block">Submit</button>
    </form>
  </div>
</section>
{% endblock %}
