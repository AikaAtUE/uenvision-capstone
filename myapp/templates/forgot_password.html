{% extends "base.html" %}
{% block title %}Trouble logging in{% endblock %}
{% block content %}
<section id="screen-forgot" class="auth-screen is-active">
  <div class="auth-photo" aria-hidden="true"></div>
  <div class="auth-card auth-card--narrow">
    <h1 class="auth-title">Trouble logging in?</h1>
    <p class="auth-sub">Enter your email and we'll send you a code to get back into your account.</p>
    <form class="auth-form" id="forgot-form">
      <label class="field"><span>Email address</span><input type="email" id="forgot-email" autocomplete="email" required></label>
      <button type="submit" class="btn btn-navy btn-block" id="send-code-btn">Send code</button>
      <p class="form-msg" id="forgot-msg"></p>
      <label class="field field--spaced"><span>Enter code</span><input type="text" id="forgot-code" inputmode="numeric" placeholder="6-digit code"></label>
      <button type="button" class="btn btn-navy btn-block" id="verify-code-btn">Submit</button>
      <p class="auth-foot"><a class="link-inline" href="{% url 'login' %}">Back to log in</a></p>
    </form>
  </div>
</section>
{% endblock %}
