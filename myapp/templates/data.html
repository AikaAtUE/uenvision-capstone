{% extends "app_base.html" %}
{% block title %}Data{% endblock %}
{% block page_content %}
<section class="page is-active" id="page-data">
  <header class="page-header"><h1>Data</h1></header>
  <div class="page-body">
    <h2 class="section-title">View &amp; export data</h2>
    <div class="data-toolbar">
      <label class="select-field">
        <span>Source</span>
        <select id="data-source">
          <option value="raw">Raw Job Data</option>
          <option value="extracted">Extracted Skills</option>
          <option value="survey">Survey</option>
          <option value="category">Skill Category</option>
        </select>
      </label>
      <label class="select-field select-field--grow">
        <span>Search</span>
        <input type="text" id="data-search" placeholder="Search this table…">
      </label>
      <button class="btn btn-red btn-sm" id="export-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        Export
      </button>
    </div>
    <p class="muted table-count" id="table-count"></p>

    <div class="table-wrap">
      <table id="data-table"></table>
    </div>
  </div>
</section>
{% endblock %}
{% block extra_partials %}
  {% include "_filter_drawer.html" %}
{% endblock %}
